[project]
name = "ai-email-followup"
version = "0.1.0"
description = "Local LangGraph demo with Bailian AI and QQ SMTP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "langgraph>=1.0,<2",
  "apscheduler>=3.11,<4",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "pydantic>=2.10,<3",
  "email-validator>=2.2,<3",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
